services:
  edgequake:
    image: ghcr.io/raphaelmansuy/edgequake:${EDGEQUAKE_VERSION:-0.36.0}
    container_name: edgequake
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "3000:3000"
    environment:
      EDGEQUAKE_DATABASE_URL: postgres://edgequake:${POSTGRES_PASSWORD:-edgequake}@postgres:5432/edgequake
      EDGEQUAKE_AUTH_ENABLED: "${EDGEQUAKE_AUTH_ENABLED:-false}"
      EDGEQUAKE_DEV_MODE: "true"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      EDGEQUAKE_EMBEDDING_PROVIDER: "${EDGEQUAKE_EMBEDDING_PROVIDER:-}"
    volumes:
      - edgequake-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  postgres:
    image: pgvector/pgvector:pg16
    container_name: edgequake-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: edgequake
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edgequake}
      POSTGRES_DB: edgequake
    volumes:
      - edgequake-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgequake -d edgequake"]
      interval: 10s
      timeout: 5s
      retries: 10

  webhook:
    image: python:3.12-slim
    container_name: edgequake-webhook
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "-c", "pip install --no-cache-dir gitpython==3.1.43 && python webhook/app.py"]
    environment:
      GITEE_TOKEN: ${GITEE_TOKEN}
      GITEE_WEBHOOK_TOKEN: ${GITEE_WEBHOOK_TOKEN}
      EDGEQUAKE_URL: http://edgequake:8080
      EDGEQUAKE_API_KEY: ${EDGEQUAKE_API_KEY:-}
      EDGEQUAKE_WORKSPACE_ID: ${EDGEQUAKE_WORKSPACE_ID:-}
      WEBHOOK_HOST: 0.0.0.0
      WEBHOOK_PORT: 9000
      REPOSITORIES: ${REPOSITORIES:-}
      ALLOWED_BRANCHES: ${ALLOWED_BRANCHES:-main,master}
    ports:
      - "127.0.0.1:9000:9000"   # 只绑本机，由 Nginx/Caddy 反代出去
    volumes:
      - ./:/app
      - ./logs:/app/logs
      - ./state:/app/state
      - ./workspace:/app/workspace
      # git 需要宿主机的 known_hosts 才能免交互
      - ~/.ssh:/root/.ssh:ro

volumes:
  edgequake-data:
  edgequake-pgdata:
