; EdgeQuake Webhook 接收服务 —— supervisor 守护配置
;
; 安装:
;   sudo cp deploy/supervisor-edgequake-webhook.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status edgequake-webhook
;
; 备选方案：直接守护裸进程（不依赖 docker），把 command 换成下面注释行即可：
;   command=/usr/bin/python3 /opt/edgequake-webhook/webhook/app.py
;   directory=/opt/edgequake-webhook

[program:edgequake-webhook]
command=/usr/bin/docker compose -f /opt/edgequake-webhook/docker-compose.yml up -f webhook --no-deps
directory=/opt/edgequake-webhook
autostart=true
autorestart=true
; 启动失败 3 次后放弃，避免无限刷日志
startretries=3
; 崩溃后等待 10 秒重启
startsecs=10
stopsignal=SIGTERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/edgequake-webhook.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/edgequake-webhook.err.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5
environment=PYTHONUNBUFFERED="1"
