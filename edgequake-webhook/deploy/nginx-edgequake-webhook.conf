# EdgeQuake Webhook —— Nginx 反向代理（HTTPS）
#
# 安装:
#   sudo cp deploy/nginx-edgequake-webhook.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 前置:
#   1. 用 certbot 申请证书:
#        sudo certbot --nginx -d webhook.example.com
#   2. 安全组放行 80/443

server {
    listen 80;
    server_name webhook.example.com;
    # certbot 会自动改写为 301 跳转 HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name webhook.example.com;

    ssl_certificate     /etc/letsencrypt/live/webhook.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webhook.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Webhook 载荷通常不大，但 JSON 文本摄入可能稍大
    client_max_body_size 10m;

    access_log /var/log/nginx/edgequake-webhook.access.log;
    error_log  /var/log/nginx/edgequake-webhook.error.log;

    location /webhook {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Gitee 侧 5 秒超时，这里给 10 秒余量
        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;
        proxy_send_timeout    10s;
    }

    location /health {
        proxy_pass http://127.0.0.1:9000/health;
        access_log off;
    }

    location / {
        default_type text/plain;
        return 200 "EdgeQuake webhook endpoint. POST /webhook\n";
    }
}
